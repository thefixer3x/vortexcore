# @lanonasis/fin-core (services/fin-core): test on change, publish on tag.
# Publishing needs the NPM_TOKEN repository secret (an npm automation token
# with publish rights on the @lanonasis scope).
name: fin-core
on:
  push:
    branches: [main]
    paths: ['services/fin-core/**', '.github/workflows/fin-core.yml']
    tags: ['fin-core-v*']
  pull_request:
    paths: ['services/fin-core/**', '.github/workflows/fin-core.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: services/fin-core
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: services/fin-core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/fin-core-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: test "fin-core-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Tag points to a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
