name: "Acceptance Gate (Issue #97)"

# Hard gate enforcement: this workflow runs the 7 acceptance gates and FAILS
# (as a required check) when any HARD gate is RED, so no deploy can proceed
# without all gates passing. Wire it up as a branch-protection required check
# on main / main-protected (alongside the deploy workflow).
#
# Env-gated HARD gates (2,3,7) block when their required environment is absent
# or the check fails; only the visual-validation SOFT gate may skip.

on:
  push:
    branches: [main, main-protected]
  pull_request:
    branches: [main, main-protected]
  workflow_dispatch:

concurrency:
  group: acceptance-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (Gate 3)
        run: bunx playwright install chromium

      - name: Run acceptance gates
        env:
          CI: "true"
          BASE_URL: https://me.vortexcore.app
          SUPABASE_DB_CONNECTION_STRING: ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: team_IY947R6mFLIOiooblMMEZanL
          VERCEL_EXPECT_TARGET: ${{ github.ref_name == 'main-protected' && 'production' || 'preview' }}
        run: |
          # Single invocation; runner exits non-zero when any HARD gate is RED,
          # so the job (a required check) blocks the deploy/merge.
          bash scripts/acceptance-gate/run-gates.sh

      - name: Upload audit trail
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-gate-results
          path: audit/acceptance-gate-results.*
          if-no-files-found: warn

      - name: Emit gate summary
        if: always()
        run: |
          echo "## Acceptance Gate results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat audit/acceptance-gate-results.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
