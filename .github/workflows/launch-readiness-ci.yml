name: Deep Browser Regression (manual)

# The seven-gate Acceptance workflow is the automatic release check. This
# broader browser diagnostic is deliberately manual so a broken UI selector
# cannot create an unbounded retry storm on every push.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed environment to exercise
        required: true
        default: https://me.vortexcore.app
        type: string

concurrency:
  group: deep-browser-regression
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run bounded browser regression
        env:
          CI: "true"
          BASE_URL: ${{ inputs.base_url }}
        run: >-
          bunx playwright test
          --project=chromium
          --workers=2
          --retries=0
          --max-failures=10

      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deep-browser-regression-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
